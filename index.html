<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>זיהוי שירים אקראי</title>
  <meta name="description" content="כלי משחק קבוצתי: שיר רנדומלי, אומן ושנה, מנוגן ישירות מהעמוד." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <noscript>הדף הזה זקוק ל-JavaScript כדי לבחור ולנגן שירים. אנא הפעילו JavaScript בדפדפן.</noscript>

  <div class="bg-glow" aria-hidden="true"></div>

  <button class="score-fab" id="scoreOpenBtn" type="button" aria-haspopup="dialog" aria-controls="scoreModal">
    <span aria-hidden="true">🏆</span> ניקוד
  </button>

  <a class="wa-fab" href="https://wa.me/972504812348" target="_blank" rel="noopener">
    <span aria-hidden="true">💬</span> צור קשר
  </a>

  <div class="modal-overlay" id="scoreOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="scoreModalTitle" id="scoreModal">
      <div class="modal-header">
        <h2 id="scoreModalTitle">ניקוד קבוצות</h2>
        <button class="modal-close" id="scoreCloseBtn" type="button" aria-label="סגירת פופאפ">×</button>
      </div>

      <div class="modal-body">
        <div class="score-setup" id="scoreSetup">
          <p class="modal-label">כמה קבוצות משחקות?</p>
          <div class="stepper">
            <button type="button" class="stepper-btn" id="teamCountMinus" aria-label="פחות קבוצות">−</button>
            <span class="stepper-value" id="teamCountValue">2</span>
            <button type="button" class="stepper-btn" id="teamCountPlus" aria-label="עוד קבוצות">+</button>
          </div>
          <button type="button" class="primary-btn" id="startScoringBtn">התחלת ניקוד</button>
        </div>

        <div class="scoreboard" id="scoreboard" hidden>
          <div class="score-rows" id="scoreRows"></div>
          <div class="scoreboard-actions">
            <button type="button" class="link-btn" id="reconfigureBtn">שינוי מספר קבוצות</button>
            <button type="button" class="danger-btn" id="resetScoresBtn">איפוס ניקוד</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <header class="masthead">
    <span class="kicker"><span class="kicker-dot" aria-hidden="true"></span>משחק זיהוי שירים · מסך משותף</span>
    <h1>מי מזהה את השיר?</h1>
  </header>

  <main class="sleeve">
    <div class="now-row">
      <div class="visualizer" aria-hidden="true">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
      <div class="track-info" aria-live="polite">
        <div class="title" id="songTitle" dir="auto">—</div>
        <div class="artist" id="songArtist" dir="auto">—</div>
        <div class="year" id="songYear">—</div>
      </div>
    </div>

    <div class="video-frame" id="videoFrame"></div>
    <p class="hint">אם הניגון לא מתחיל לבד — לחצו על כפתור ההפעלה בתוך הנגן.</p>

    <div class="controls">
      <button class="shuffle-btn" id="shuffleBtn" type="button">
        <span aria-hidden="true">🔀</span> שיר הבא
      </button>
      <a class="yt-link" id="ytLink" href="#" target="_blank" rel="noopener">פתח ביוטיוב ↗</a>
    </div>
  </main>

  <footer class="meta" id="songCount">—</footer>

  <script src="songs.js"></script>
  <script src="app.js"></script>
  <script src="score.js"></script>
</body>
</html>
