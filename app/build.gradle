plugins {
    id 'com.android.application'
}

def webAppManifest = [
    applicationId: 'com.muzikaparty.app',
    hostName: 'muzika.sofrimyamim.com', // The domain loaded in the WebView.
    launchUrl: '/?source=pwa', // The start path. Must be relative to the domain.
    name: 'מי מזהה את השיר?', // The application name.
    launcherName: 'מזהי שירים', // The name shown on the Android Launcher.
]

android {
    compileSdkVersion 36
    namespace "com.muzikaparty.app"
    defaultConfig {
        applicationId "com.muzikaparty.app"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 10
        versionName "10"

        // The name for the application
        resValue "string", "appName", webAppManifest.name

        // The name for the application on the Android Launcher
        resValue "string", "launcherName", webAppManifest.launcherName

        // The URL loaded into the WebView on launch
        def launchUrl = "https://" + webAppManifest.hostName + webAppManifest.launchUrl
        resValue "string", "launchUrl", launchUrl

        // The hostname is used to tell in-site navigation (stays in the
        // WebView) apart from external links (opened in an outside app).
        resValue "string", "hostName", webAppManifest.hostName
    }
    buildTypes {
        release {
            minifyEnabled true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

repositories {
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Google Mobile Ads SDK
    implementation 'com.google.android.gms:play-services-ads:22.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'
    // Play services pulls androidx.fragment 1.0.0 (flagged by Play); pin a current version.
    implementation 'androidx.fragment:fragment:1.6.2'
}
